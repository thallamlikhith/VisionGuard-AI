<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trinetra AI</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 24px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: #12151a; color: #e8ecf1;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #8b95a5; margin: 0 0 12px; }
  .sub { color: #8b95a5; font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; max-width: 1000px; }
  .card { background: #1a1f27; border: 1px solid #262c36; border-radius: 10px; padding: 16px; }
  .row { display: flex; justify-content: space-between; padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; background: #20262f; font-size: 14px; }
  .badge { font-weight: 700; font-size: 11px; padding: 2px 8px; border-radius: 10px; letter-spacing: .5px; }
  .OUTSIDE { color: #3ddc84; }
  .INSIDE { color: #ffc043; }
  .ALERT  { color: #ff5b5b; }
  .empty { color: #6b7480; font-size: 13px; padding: 6px 10px; }
  .machine { font-size: 17px; font-weight: 600; }
  .meta { color: #8b95a5; font-size: 12px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #262c36; }
  th { color: #8b95a5; font-weight: 600; font-size: 11px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  #status { float: right; font-size: 12px; color: #8b95a5; }
</style>
</head>
<body>
  <span id="status">connecting...</span>
  <h1>Trinetra AI</h1>
  <div class="sub">Warning / monitoring prototype &mdash; not a safety interlock.</div>

  <div class="grid">
    <div class="card">
      <h2>Machine</h2>
      <div class="machine" id="machine">-</div>
      <div class="meta" id="machine-meta"></div>
    </div>

    <div class="card">
      <h2>Current workers</h2>
      <div id="workers"><div class="empty">No worker data yet. Start app.py.</div></div>
    </div>

    <div class="card" style="grid-column: 1 / -1;">
      <h2>Recent events</h2>
      <table>
        <thead>
          <tr><th>Worker</th><th>Event</th><th>Machine</th><th>Dwell (s)</th><th>Time (UTC)</th></tr>
        </thead>
        <tbody id="events"><tr><td colspan="5" class="empty">No events yet.</td></tr></tbody>
      </table>
    </div>
  </div>

<script>
const REFRESH_MS = 2000;

function esc(value) {
  return String(value).replace(/[^a-zA-Z0-9#.:-]/g, "");
}

async function getJSON(url) {
  const response = await fetch(url);
  if (!response.ok) throw new Error(url + " -> " + response.status);
  return response.json();
}

function renderWorkers(data) {
  const machine = document.getElementById("machine");
  const meta = document.getElementById("machine-meta");
  const box = document.getElementById("workers");

  if (!data.running || !data.machine) {
    machine.textContent = "-";
    meta.textContent = "";
    box.innerHTML = '<div class="empty">app.py is not running (no data/workers.json).</div>';
    return;
  }

  machine.textContent = data.machine.name;
  meta.textContent = "id: " + data.machine.id + "  |  mode: " + data.rules.mode +
                     "  |  dwell limit: " + data.rules.dwell_seconds + "s";

  if (!data.workers.length) {
    box.innerHTML = '<div class="empty">No workers detected.</div>';
    return;
  }

  box.innerHTML = data.workers.map(w =>
    '<div class="row"><span>Worker #' + esc(w.worker_id) + '</span>' +
    '<span class="badge ' + esc(w.state) + '">' + esc(w.state) +
    (w.state === "OUTSIDE" ? "" : " - " + Number(w.dwell_seconds).toFixed(1) + " sec") +
    '</span></div>'
  ).join("");
}

function renderEvents(data) {
  const body = document.getElementById("events");
  if (!data.events.length) {
    body.innerHTML = '<tr><td colspan="5" class="empty">No events yet.</td></tr>';
    return;
  }
  body.innerHTML = data.events.map(e =>
    "<tr><td>Worker #" + esc(e.worker_id) + "</td>" +
    '<td class="' + (e.event_type === "DWELL_ALERT" ? "ALERT" : "") + '">' + esc(e.event_type) + "</td>" +
    "<td>" + esc(e.machine_id) + "</td>" +
    "<td>" + Number(e.dwell_seconds).toFixed(1) + "</td>" +
    "<td>" + esc((e.alert_at || e.entered_at || "").replace("T", " ").replace(".000000", "").slice(0, 19)) + "</td></tr>"
  ).join("");
}

async function refresh() {
  const status = document.getElementById("status");
  try {
    const [workers, events] = await Promise.all([getJSON("/workers"), getJSON("/events?limit=20")]);
    renderWorkers(workers);
    renderEvents(events);
    status.textContent = "updated " + new Date().toLocaleTimeString();
  } catch (error) {
    status.textContent = "API offline - run: uvicorn api.server:app --reload";
  }
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
